[phases.setup]
nixPkgs = ["ffmpeg", "python312"]

[phases.build]
cmds = [
  "mkdir -p models/whisper models/sentence-transformers",
  "python -c \"import whisper; whisper.load_model('base', download_root='models/whisper')\"",
  "python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', cache_folder='models/sentence-transformers')\""
]